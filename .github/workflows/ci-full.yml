        env:
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          CI=true npm run test:blueprints:descriptor
          CI=true npm run test:blueprints:setup
          python3 ../scripts/blueprints-runtime-mutations.py --output-dir /tmp/blueprint-runtime-proof
          python3 ../scripts/blueprints-gate-authority-mutations.py .. /tmp/blueprint-authority-proof
          python3 ../scripts/blueprints-lifecycle-mutations.py --output-dir /tmp/blueprint-lifecycle-proof
          # Exact inventory: 22 runtime checks plus five Phase-capture checks.
          CI=true python3 ../scripts/blueprints-replay-order-mutations.py --profile ci --expected-tests 27 --output-dir /tmp/blueprint-replay-order-proof
      - name: Blueprint MCP real-red controls in isolated source (7e202fca)
        run: python3 ../scripts/blueprints-isolated-proof.py --kind transport --output /tmp/blueprint-mcp-proof D15-forbidden-MCP-publish MCP-required-key MCP-header-forwarding MCP-complete-receipt MCP-target-closed
      - name: Three clean Blueprint installations and portability (7e202fca)
        env:
          CI: 'true'
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: python3 ../scripts/blueprints-examples-live.py --profile ci --root .. --output /tmp/blueprint-examples-proof --with-exporter-mutation

  live_gates:
    name: Live authorization gates against a real PostgreSQL
    # The order-sensitive live chain, unbroken and in its main order. The
    # list/point parity gate stays FIRST on a freshly migrated database because
    # its assertions are equalities over counts, and the boot check keeps its
    # position ahead of the two steps that read `backend/dist`.
    # The runner's own job timeout is 75m; this matches it.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
        options: >-
          --health-cmd "pg_isready -U relayhall_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ledger gate resolves a BASELINE commit and fails
          # closed when it cannot (review 696bff8c, R2-F5): a shallow clone has
          # no `origin/main` and no first parent, so the deletion and
          # append-only controls would have nothing to compare against. A
          # warning-and-skip is not a safety control, so the history it needs
          # is fetched instead of the control being softened.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The service container's own health-check gates nothing in THIS job. The
      # backend job reaches its bootstrap only after `tsc` and a full jest run,
