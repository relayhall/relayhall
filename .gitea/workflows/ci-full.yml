  feata_drills:
    name: FEAT-A mutation drills
    # The FEAT-A drills own this job. On main the backend drill runs directly
    # after the Task write-field contract on the shared database; it drives that
    # same suite under mutation and builds its own fixtures, so a freshly
    # migrated database is the stricter starting state, not a weaker one.
    # The runner's own job timeout is 150m (raised from 75m on 11 Oct 2026: the document-controls job needs 63 minutes idle and more beside a lane); this matches it.
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ledger gate resolves a BASELINE commit and fails
          # closed when it cannot (review 696bff8c, R2-F5): a shallow clone has
          # no `origin/main` and no first parent, so the deletion and
          # append-only controls would have nothing to compare against. A
          # warning-and-skip is not a safety control, so the history it needs
          # is fetched instead of the control being softened.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Runner service health is supplemental: this job must independently pass
      # the TCP/query readiness gate before loading schema or running any tests.
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        # A shared, bounded gate keeps two successful queries two seconds apart.
        # Slow first boot is allowed up to 180s; failures retain safe diagnostics.
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      - name: FEAT-A backend red proofs (7d38a6e0)
        env:
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: python3 ../scripts/feata-mutation-drill.py --suite backend
      - name: FEAT-A MCP receipt and schema red proofs
        run: python3 ../scripts/feata-mcp-mutations.py

  # The scale gate measures a small estate against a much larger one, and needs
  # a fivefold size difference between them. It keeps a job-owned database so
  # that no earlier gate can inflate the small population - which is also why
  # it is the ONLY step in its group, and therefore trivially the last one.
  scale_load:
    name: Task read-load contract
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ledger gate resolves a BASELINE commit and fails
          # closed when it cannot (review 696bff8c, R2-F5): a shallow clone has
          # no `origin/main` and no first parent, so the deletion and
          # append-only controls would have nothing to compare against. A
          # warning-and-skip is not a safety control, so the history it needs
          # is fetched instead of the control being softened.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      # Runner service health is supplemental: this job must independently pass
      # the TCP/query readiness gate before loading schema or running any tests.
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        # A shared, bounded gate keeps two successful queries two seconds apart.
        # Slow first boot is allowed up to 180s; failures retain safe diagnostics.
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      # Card 590e88cc. GET /tasks computed its dependency fields with a
      # `Promise.all` over the UNPAGINATED estate — three point reads per Task,
      # each re-reading Tasks through `getTask` — so ONE request against a
      # 5,200-Task estate offered the pool 9,186 connection acquisitions
      # against `max: 20` / `connectionTimeoutMillis: 2000`. The acquisitions
      # that waited longer than two seconds threw, and every OTHER caller
      # sharing those twenty connections failed with them: that is the reported
      # "intermittent 500s across five task-read paths and the AutoArchive
      # job". What broke is a connection ceiling and a per-row fan-out; a
      # mocked pool acquires nothing, so the property is measured through the
      # production router against a real PostgreSQL at estate scale. Its
      # database starts fresh: rows from earlier live gates would inflate the
      # small population and invalidate the required fivefold size difference.
      # The command, fixture guards and assertions stay unchanged and unconditional.
      - name: Task read paths under load at estate scale (590e88cc)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: npm run test:scale-load

  completion_reference_lifecycle:
    name: Completion reference lifecycle owned PostgreSQL
    runs-on: relayhall-full
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: mixed_cleanup_test_lifecycle
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    container: node:22.23.4-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    env:
      CI: 'true'
      RELAYHALL_OWNED_FIXTURE: completion-reference
      RELAYHALL_TEST_DB_URL: postgresql://fixture:fixture@postgres:5432/mixed_cleanup_test_lifecycle
      PGHOST: postgres
      DB_HOST: postgres
      PGPORT: '5432'
      DB_PORT: '5432'
      PGDATABASE: mixed_cleanup_test_lifecycle
      DB_NAME: mixed_cleanup_test_lifecycle
      PGUSER: fixture
      DB_USER: fixture
      PGPASSWORD: fixture
      DB_PASSWORD: fixture
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: node scripts/wait-for-postgres.js && node scripts/load-base-schema.js && npx ts-node --transpile-only src/db/migrate.ts
      - name: Completion reference lifecycle storage regressions
        run: npm run test:completion-reference-lifecycle
