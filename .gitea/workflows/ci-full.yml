  board_drill_controls:
    name: Board-wide mutation drills on their own databases
    # Machinery queue 9b761f09: the Access Explorer and the Notifications and
    # Timeline drills read board-wide state, so each migrates a fresh template
    # database and starts every live run on a fresh copy of it, restoring this
    # job's database at the end (docs/ci.md). On the shared database the Access
    # Explorer runs grew slower one after another and pushed drill_controls
    # past its 150 minutes (full-tier run 6440); together they are about 50
    # minutes, so they have this job to themselves.
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The disposable-copy drills copy the committed tree; the history is
          # fetched so a copy is the same tree a developer's checkout holds.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      - name: Access Explorer mutation controls (1e56dbef)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/access-explorer-mutations.py --output-dir "$proof_dir/receipts"
      - name: Notifications and Timeline mutation controls (5854f0d6)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/notifications-timeline-mutations.py --output-dir "$proof_dir/receipts"
      - name: Action Center queue for agents mutation controls (E467)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/action-items-owner-mutations.py --output-dir "$proof_dir/receipts"

  authority_edit_controls:
    name: Authority edit in place, live and mutation controls
    # Card 1a38270d (AUTHZ amendment AZ-A13 stage 2, edit in place). Its own
    # job, from its own freshly migrated database: the live suite and then its
    # red-proof drill, which drives that suite once per control (about 40
    # minutes), so neither lengthens the 150-minute budget of another job.
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ledger gate resolves a BASELINE commit and fails
          # closed when it cannot (review 696bff8c, R2-F5): a shallow clone has
          # no `origin/main` and no first parent, so the deletion and
          # append-only controls would have nothing to compare against. A
          # warning-and-skip is not a safety control, so the history it needs
          # is fetched instead of the control being softened.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Runner service health is supplemental: this job must independently pass
      # the TCP/query readiness gate before loading schema or running any tests.
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        # A shared, bounded gate keeps two successful queries two seconds apart.
        # Slow first boot is allowed up to 180s; failures retain safe diagnostics.
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      # Editing a Connector credential, a warrant and a grant IN PLACE, against a
      # REAL PostgreSQL through the production router and the MCP ingress: the
      # narrowing save, the one-act widening with step-up (root, an
      # administrator, the owning Account within its own access), the agent's
      # filing and the decide on /approvals, the stale check, the caps, the
      # lifetime with its revert and sweep, the narrow-all act, the warrant pin
      # and riding tasks, the grant rules, the audit shape and the secret kept
      # out of every record; the edited credential is USED with the same token.
      # The same step runs the follow-ups suite (owner rulings E148 and E149):
      # the residual a revert keeps, named in its records, and no edit adding
      # knowledge-contents:write to an Agent credential.
      - name: Authority edits in place, live (1a38270d)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: npm run test:authority-edit
      # Card ff410dc4 (owner ruling E407 item 1): the Access page's grants list
      # read one keyset page at a time against a REAL PostgreSQL through the
      # production router: no duplicate and no gap across pages while rows are
      # written and revoked between them, under every sort; each row's origin
      # derived from the grants columns and the audit ledger, never guessed;
      # every filter, the search and the root ceiling (two Accounts without
      # root see nothing); and EXPLAIN of the default query on a seeded table.
      - name: Grants list paging and origin, live (ff410dc4)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: npm run test:grants-list
      # Owner rulings E407 item 2, E413 and E418(b) against a REAL PostgreSQL
      # through the production router and MCP ingress: the creation writer
      # writes a grant only when the authorization engine says it changes
      # access; the session-only bulk revoke (dry run by default, at most 500
      # ids, a step-up bound to the id set, a live re-check per id, a read-back
      # that rolls the whole batch back on any difference, one audit row per
      # grant and one summary row); and the single DELETE's session and
      # step-up refusals and allowed path.
      - name: Grants writer, bulk revoke and single delete, live (E413)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: npm run test:grants-bulk-revoke
      # Each control withdraws ONE rule of E407 item 2, E413 or E418(b) (or one
      # engine arm the writer's skip rests on) and must redden exactly its
      # declared tests of that suite, for an assertion.
      - name: Grants writer and bulk revoke mutation controls (E413)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/grants-bulk-revoke-mutations.py --output-dir "$proof_dir/receipts"
      # Each control withdraws ONE rule the amendment binds and must redden
      # exactly its declared tests, for an assertion: the census controls (the
      # writer and reader registers, the method-specific MCP ban), the live
      # controls, and drill 8, one mutation in the shared credential policy
      # that reddens the credential-request suite too (clause 7, E73), and the
      # follow-ups controls (E148, E149), and the stage 3 lifetime/step-up and
      # N14 quota controls against their own named assertions.
      - name: Authority edit in place mutation controls (1a38270d)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/authority-edit-mutations.py --suite census --output-dir "$proof_dir/census-receipts"
          python3 ../scripts/authority-edit-mutations.py --output-dir "$proof_dir/receipts"
          python3 ../scripts/authority-edit-mutations.py --suite credential --output-dir "$proof_dir/credential-receipts"
          python3 ../scripts/authority-edit-mutations.py --suite followups --output-dir "$proof_dir/followups-receipts"
          python3 ../scripts/authority-edit-mutations.py --suite stage3 --output-dir "$proof_dir/stage3-receipts"

