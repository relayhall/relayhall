name: CI (full)

# TIER 2. The complete real-PostgreSQL chain, every mutation drill and every
# red-proof control that used to run serially inside the `backend` job of
# `ci.yml`, plus the carriage and scale jobs.
#
# Owner ruling 2026-09-07: "Parallelise everything; working on branches run a
# smaller number of tests focused on the thing being built; run the full tests
# only on demand, pre-release, when ready for final testing - not on every
# merge, because there may be multiple merges and one final test when they all
# come together."
#
# THE GUARD ON THAT RULING, and the reason this file is not merely optional: a
# tier-2 green ON THE EXACT SHA is required before any TST or production
# deploy and before any release tag. DEV may be deployed from a fast-tier-green
# `main`. See docs/ci.md.
#
# NOTHING IN THIS FILE CARRIES AN `if:`. A gate that can be skipped by a
# condition is a gate that will be skipped on the promotion it was written for,
# and `scripts/check-workflow-shape.py` fails this file if one appears. The
# trigger is the only thing that decides whether these gates run.

# TRIGGERS, and why they are only these two. `release/**` and `v*` were the
# obvious third and fourth, and they are deliberately absent: this forge
# cancels a run to free a runner slot, and a push that schedules BOTH
# workflows on ONE ref puts them in that queue against each other. Four
# full-tier runs were destroyed that way (1025, 1027, 1030, 1032) before the
# rule was found. A release ref keeps the FAST tier - it owns the
# publication, terminology and residue gates - and a `v*` release tag runs
# neither tier (see `ci.yml`), so the full tier stays off those refs and is
# asked for by name instead:
#
#     git push origin <sha>:refs/heads/ci-full/<name>
#
# which is what the promotion guard requires anyway: a full-tier green on the
# exact SHA, recorded BEFORE the tag exists. See docs/ci.md.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci-full/**'

permissions:
  contents: read

# Development full-test branches retain only their newest candidate.
# Manual dispatch and ci-full/release/** or ci-full/main preserve each run.
concurrency:
  group: full-${{ github.ref }}-${{ (github.event_name != 'push' || contains(github.ref, '/release/') || endsWith(github.ref, '/main')) && github.run_id || 'dev' }}
  cancel-in-progress: true

jobs:

  # DEFINITION ORDER IS LOAD ORDER. The runner has four job slots and this
  # workflow has six jobs, so the two dispatched last decide the wall clock.
  # The carriage drill is the longest single step in the repository (17-29
  # minutes on runs 1019-1021) and cannot be split, so it goes first; the two
  # shortest jobs go last.
  #
  # Keep the complete carriage mutation drill in its own job with an isolated
  # database, so it does not share that budget with the live gates.
  carriage_controls:
    name: Directory carriage mutation controls
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ledger gate resolves a BASELINE commit and fails
          # closed when it cannot (review 696bff8c, R2-F5): a shallow clone has
          # no `origin/main` and no first parent, so the deletion and
          # append-only controls would have nothing to compare against. A
          # warning-and-skip is not a safety control, so the history it needs
          # is fetched instead of the control being softened.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Runner service health is supplemental: this job must independently pass
      # the TCP/query readiness gate before loading schema or running any tests.
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        # A shared, bounded gate keeps two successful queries two seconds apart.
        # Slow first boot is allowed up to 180s; failures retain safe diagnostics.
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      # RH-LENSES-a obligation B-L10a. Every control this card ships carries at
      # least one RED MUTATION, proven HERE - at build time - to redden that
      # control while every other control in the drill stays green. A mutation
      # that reddens nothing FAILS THE BUILD, and so does one that reddens
      # something the table does not name: collateral is how one over-sensitive
      # assertion stands in for an independently broken control. The design
      # record deliberately names no mutations, because whether one reddens is a
      # runtime property no design round can measure.
      - name: Red-proof drill for the carriage controls (74e02a05, B-L10a)
        env:
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: npm run drill:lenses-a

  mutation_controls:
    name: Inheritance and Blueprint document mutation controls
    # The two heaviest red-proof drills on main (about 17 and 8 minutes) shared
    # one serial job with everything else. Neither reads rows another gate
    # wrote: each drives its own suite under mutation, so both start from this
    # job's own freshly migrated database, in the order they hold on main.
    # The runner's own job timeout is 150m (raised from 75m on 11 Oct 2026: the document-controls job needs 63 minutes idle and more beside a lane); this matches it.
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-ledger gate resolves a BASELINE commit and fails
          # closed when it cannot (review 696bff8c, R2-F5): a shallow clone has
          # no `origin/main` and no first parent, so the deletion and
          # append-only controls would have nothing to compare against. A
          # warning-and-skip is not a safety control, so the history it needs
          # is fetched instead of the control being softened.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Runner service health is supplemental: this job must independently pass
      # the TCP/query readiness gate before loading schema or running any tests.
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        # A shared, bounded gate keeps two successful queries two seconds apart.
        # Slow first boot is allowed up to 180s; failures retain safe diagnostics.
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      - name: Project to Task inheritance semantic controls
        env:
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/project-task-inheritance-mutations.py --output-dir "$proof_dir/receipts"
      # Card 785e1eed P1-C. Eight controls widen the mint ceiling past the live
      # predicate (three in the live arm, three in the algebra arm, two by
      # dropping a half of the filing check) and one narrows it back to the
      # pre-repair algebra; each must redden exactly its declared tests.
      - name: Agent mint ceiling mutation controls (785e1eed)
        env:
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/mint-ceiling-mutations.py --output-dir "$proof_dir/receipts"
      # Card 40e0e542. Seven controls, each of which must redden exactly its
      # declared tests of the unit, pin, live and Knowledge page suites: drop
      # the archive subtraction; forward includeArchive to the source as a
      # field; let archiveCategories escape the declared categories; change the
      # selector schema without moving its sha256 pin; and the rider's three -
      # make the scope sentence unconditional; drop the opt-in from the search
      # ledger; remove the page's fix for a tick made before the principal
      # read resolves. The page suite is vitest, so the frontend is installed.
      - name: Install the frontend for the default search scope drill (40e0e542)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # Machinery queue 9b761f09: two vitest-only lane drills that sat in no
      # tier and rotted unseen (a literal test count; anchors that moved). The
      # UI drill clones the clean checkout and must run before any step could
      # leave a file in it; each control must redden exactly its declared test
      # and the source is fingerprinted before and after. No database.
      - name: UI refinement mutation controls (9b761f09)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/ui-refinement-mutations.py --source .. --output "$proof_dir/ui-refinement"
      - name: Settings identity UI mutation controls (9b761f09)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/ui-settings-mutations.py --source .. --output "$proof_dir/ui-settings"
      - name: Map plane mutation controls (9b761f09)
        run: python3 ../scripts/test-map-plane-mutations.py
      # The Personality projection controls run jest against a private copy of
      # backend/src with a mocked database (no live schema proof; the live
      # Personality contract runs in live_gates).
      - name: Personality version projection mutation controls (9b761f09)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/test-personality-version-mutations.py --output-dir "$proof_dir/personality-version"
      - name: Authority edit frontend mutation controls (AZ-A13 stage 3)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/authority-edit-frontend-mutations.py --output-dir "$proof_dir/receipts"
      - name: Knowledge default search scope mutation controls (40e0e542)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/knowledge-default-scope-mutations.py --output-dir "$proof_dir/receipts"
      # Card 1fd5de08, line 1 (owner ruling E428). Nine controls, each of which must
      # redden exactly its declared tests of the console's live suite or its two
      # vitest suites: the source list, the search fan-out and the get route
      # each without the selector arm; the page filtering results on the
      # client; the explain view dropping the score; the coverage lines
      # dropping an unavailable source; the reader showing a refusal as a
      # failure, naming the refusal's cause, and rendering source bytes as
      # markup. The frontend installed above serves the vitest half.
      - name: Knowledge search console mutation controls (F14 1fd5de08)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/knowledge-console-mutations.py --output-dir "$proof_dir/receipts"
      # Card b595b3b0. Eleven controls, each of which must redden exactly its
      # declared tests of the live activity suite or the board and hook vitest
      # suites: activity read for ids the caller may not read; an absent
      # observation presented as activity; an earlier assignment epoch revived;
      # the card inferring activity from the lifecycle status; a hidden tab
      # still reading; an obsolete read publishing over a newer one; and the
      # 30d198df follow-ups: a board update emptying every badge; the board
      # reading cards outside In Progress; such a card showing a badge; clock
      # skew refusing the batch; a kept row losing its deadline. The
      # frontend installed above serves the vitest half.
      - name: Task activity mutation controls (b595b3b0)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/task-activity-mutations.py --output-dir "$proof_dir/receipts"
      # Card 8fe6d7bb. Eight controls on the plugin deployment view default,
      # each of which must redden exactly its declared tests of the plugin host
      # contract, proxy, installation-route and view-default live suites: the
      # default satisfies a non-view capability; the proxy write path admits
      # it; the write description admits it; the settings filter applies it to
      # a non-view entry; a malformed default loads; a default that bypassed
      # validation counts at use time; it reaches a request without an Account;
      # the per-entry settings read-only flag admits it (card bedf50cc).
      # Jest only, no database.
      - name: Plugin view default mutation controls (8fe6d7bb)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/plugin-view-default-mutations.py --output-dir "$proof_dir/receipts"
      # Card d1471ea9 (owner ruling E438(1)). Five controls on the sidebar
      # widget grow opt-in, each of which must redden exactly its declared tests
      # of the widget vitest suite or the plugin contract and installation jest
      # suites: every widget grows without the opt-in; an opted-in widget has no
      # host ceiling; a resize message skips the origin and source-window check;
      # a grow that is not a boolean loads; the registry drops grow: true. The
      # frontend installed above serves the vitest half. No database.
      - name: Sidebar widget grow mutation controls (E438, d1471ea9)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/plugin-widget-grow-mutations.py --output-dir "$proof_dir/receipts"
      # Card fa519c4c (subtask 2085337). Fourteen controls on the plugin health
      # probe, each of which must redden exactly its declared tests of the probe
      # suite (real sockets, real fetch, the answers recorded from the plugin
      # containers) or the loader pin: the cause code is not read; the cause is
      # read through a getter; a timeout is not named; a 3xx is not named; a
      # redirect is followed; a degraded 2xx counts healthy; the recorded
      # "healthy" word is refused; an undocumented 2xx body marks the plugin
      # unhealthy; the body read is unbounded; the log line loses the plugin
      # name; the log line carries an address; an unchanged failure logs on
      # every tick; a recovery is silent; a non-2xx loses its number. No database.
      - name: Plugin health probe mutation controls (fa519c4c)
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/plugin-health-probe-mutations.py --output-dir "$proof_dir/receipts"
      - name: Blueprint document policy and census real-red controls (7e202fca)
        run: |
          python3 ../scripts/blueprints-document-mutations.py --output-dir /tmp/blueprint-document-proof
          python3 ../scripts/blueprints-descriptor-mutations.py --output-dir /tmp/blueprint-descriptor-proof
          python3 ../scripts/blueprints-schema-mutations.py --output-dir /tmp/blueprint-schema-proof
          python3 ../scripts/blueprints-setup-mutations.py --output-dir /tmp/blueprint-setup-proof
          python3 ../scripts/blueprints-census-mutations.py --root .. --output /tmp/blueprint-census-proof
      # Card 785e1eed P1-B (AZ-A9 grant requests). Twelve controls each withdraw
      # one rule the amendment's clauses bind - the inert grantee, ALREADY_HELD,
      # the approved expiry, the decider ceiling, the bearer-only plane, the
      # administrator-or-root decider, the admin-verb closure, both terminal
      # writers' revocation, the phase arm, the narrowing rule and (E43 Q1) the
      # administrator arm on every kind - and each must redden exactly its
      # declared tests of the live suite. P1-B-2 (clause 13) adds the credential
      # suite's controls: the executor and decide ceilings, the collect binding,
      # the scope closures, the scope narrowing, the terminal revoke, the secret
      # kept out of the ledger, ALREADY_HELD and the decider arm.
      - name: Grant and credential request mutation controls (785e1eed P1-B, P1-B-2)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/access-request-mutations.py --output-dir "$proof_dir/receipts"
          python3 ../scripts/access-request-mutations.py --suite credential --output-dir "$proof_dir/credential-receipts"
      # Card 46cfbd1d (LENSES-c c1-A), given a tier by machinery queue
      # 9b761f09: its anchors drifted twice while it ran nowhere. Seventeen
      # controls on the Group roles relation (migration 152, the fragment, the
      # route register, the owner removal order, the bearer branch, the
      # session seam), each of which must redden exactly its declared tests of
      # the live, register and seam suites, in a disposable copy; a closing
      # run re-applies the original migration and the source is fingerprinted.
      - name: Group roles mutation controls (46cfbd1d)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/lenses-stewards-mutations.py --output-dir "$proof_dir/receipts"
      # Card 4e159741 (RH-LENSES-d, obligation B-L10d): the design names no red
      # mutation, so the build writes and proves them. Ten on the lens contract
      # (the route ceiling's placement, the admin arm in both directions, the
      # absent manager key, the one session classification, a route that
      # consults the lens - which the live comparison sees once the lens surface
      # is removed - and a load-time copy the importer register sees) and six
      # on the dashboard's lens navigation (frontend installed above), each of
      # which must redden exactly its declared tests, in a disposable copy.
      - name: Lens contract mutation controls (4e159741)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/lenses-d-mutations.py --output-dir "$proof_dir/receipts"
          python3 ../scripts/lenses-d-mutations.py --suite frontend --output-dir "$proof_dir/frontend-receipts"
      # Card b5c83682 (LENSES-c c1-B; design delta G.2 drill 11): every control
      # of the owner-only gates and the manager lens ships a mutation that
      # reddens it alone - the scope rules' order, each gate's predicate order
      # and its owner-only standing, the step-up bindings, the row locks, the
      # lens's fragment and its absent key - each of which must redden exactly
      # its declared tests of the live, register, seam and lens suites, in a
      # disposable copy, with a closing baseline and a fingerprinted source.
      - name: Owner-only gates mutation controls (b5c83682)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
        run: |
          proof_dir="$(mktemp -d)"
          python3 ../scripts/lenses-gates-mutations.py --output-dir "$proof_dir/receipts"

  drill_controls:
    name: Mutation and compiled-process drills given a tier
    # Machinery queue 9b761f09: eighteen drills ran in no tier, and four of them
    # had rotted (anchors moved by a refactor, a timing ratio measured against
    # an acquisition deadline that later grew, a developer's fixed container
    # name). Each cheap green one now has a step here, on this job's own
    # database; the two expensive ones stay on demand (docs/ci.md, "Drills
    # outside both tiers"). The compiled-process drill that needs a FRESH
    # database runs first. The two drills that bring their own databases run
    # in board_drill_controls, so neither job comes near its budget.
    timeout-minutes: 150
    runs-on: relayhall-full
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relayhall_ci
          POSTGRES_PASSWORD: relayhall_ci
          POSTGRES_DB: relayhall_ci
          PGCTLTIMEOUT: '300'
          POSTGRES_INITDB_ARGS: --no-sync
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U relayhall_ci -d relayhall_ci"
          --health-start-period 120s --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The disposable-copy drills copy the committed tree; the history is
          # fetched so a copy is the same tree a developer's checkout holds.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Wait for PostgreSQL to accept connections
        env:
          PGHOST: postgres
          PGPORT: '5432'
          PGUSER: relayhall_ci
          PGPASSWORD: relayhall_ci
          PGDATABASE: relayhall_ci
        run: node scripts/wait-for-postgres.js
      - name: Bring up the contract database (base schema + migrations)
        env:
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/load-base-schema.js && npm run migrate
      # The compiled-process drills boot dist/server.js, the artefact the
      # container runs, so the build is part of what they measure.
      - name: Build the backend the compiled-process drills boot
        run: npm run build
      # Card 46cfbd1d (LENSES-c). Needs a FRESH database: it is the first
      # drill on this job's database.
      - name: Group stewards against the compiled process (46cfbd1d)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/lenses-stewards-compiled-drill.js
      - name: Authority edit in place against the compiled process (1a38270d)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/authority-edit-compiled-drill.js
      - name: Group owner tiers against the compiled process (ee81ee0f)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/group-owner-compiled-drill.js
      - name: Group ownership transfer against the compiled process (311229fd)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/group-ownership-transfer-compiled-drill.js
      - name: Group principal against the compiled process (20f40e40)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/group-principal-compiled-drill.js
      # Card a9b1e69c (AZ-A12 build 5, G.2 drill 9): the hub classes, the owner
      # fields, the owner-change socket and the Group-owner feed basis against
      # the compiled process, with real sessions, step-up and sockets.
      - name: Group owner hub against the compiled process (a9b1e69c)
        env:
          CI: 'true'
          RELAYHALL_TEST_DB_URL: postgres://relayhall_ci:relayhall_ci@postgres:5432/relayhall_ci
          DB_HOST: postgres
          DB_PORT: '5432'
          DB_NAME: relayhall_ci
          DB_USER: relayhall_ci
          DB_PASSWORD: relayhall_ci
        run: node scripts/group-owner-hub-compiled-drill.js
      # Card 1e56dbef (AZ-A12 build 6, clause 12): the Access Explorer read
