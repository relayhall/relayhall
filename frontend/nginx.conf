# The browser's origin, as the backend must see it. The backend names its own
# address in every onboarding pack (backend/src/utils/onboardingPack.ts,
# boardEndpointFor) from X-Forwarded-Proto and X-Forwarded-Host or Host, unless
# the deployment declares RELAYHALL_PUBLIC_API_URL. This nginx forwarded `$host`
# (the host WITHOUT its port) and its own `$scheme` (always http in here), so an
# install on :8082 handed out http://localhost/api, and one behind a TLS proxy
# handed out http:// on its https port.
#
# Scheme: https or http when an outer proxy declared it first in
# X-Forwarded-Proto, else this nginx's own scheme, so a direct request is
# unchanged; nothing else a client writes in that header is passed on. The
# backend trusts the forwarded scheme from one hop (TRUST_PROXY_HOPS, default 1),
# exactly as before; it decides no authority.
map $http_x_forwarded_proto $relayhall_forwarded_proto {
    default              $scheme;
    ~*^https\s*(,|$)     https;
    ~*^http\s*(,|$)      http;
}

# Host: the Host header exactly as it arrived, port included; `$host` only when
# a client sent none. An outer proxy's own X-Forwarded-Host is not touched and
# still wins in the backend.
map $http_host $relayhall_forwarded_host {
    default              $http_host;
    ""                   $host;
}

server {
    listen 80;
    server_name localhost;

    # Card bef2f3e7: emit a relative Location on every `return 30x /path` below, so a browser that arrived on https is not redirected to nginx's own http $scheme behind the TLS-terminating proxy.
    absolute_redirect off;

    # Baseline Content-Security-Policy (RH-DESIGN.6 §5.6, RH-UI.4; design note
    # f33f5bc7). Two things about it are deliberate and easy to undo by accident:
    #
    #  1. The one script-src hash is the THEME BOOT SNIPPET's. That snippet is
    #     inline on purpose — an external script costs a round trip on the paint
    #     path, which is the flash it exists to prevent — so it is the one script
    #     this policy admits. The value is recorded in docs/design-system.md §5
    #     and proved against BOTH the source and the built dist/index.html by
    #     scripts/check-theme-boot-hash.py. Never copy it by hand from the file:
    #     Vite minifies inline scripts, and a stale hash fails silently as a
    #     flash nobody can reproduce.
    #
    #  2. `connect-src 'self'` and NOT `wss:`. Modern CSP resolves the
    #     same-origin WebSocket against 'self', while the bare `wss:` scheme in
    #     the v1 draft would have permitted a socket to ANY host — an
    #     exfiltration channel granted to prevent a problem that does not exist
    #     (review S-F2).
    set $relayhall_csp "default-src 'self'; script-src 'self' 'sha256-p62EDMEN+tmK7OL9Aevygjmux5c2p3gl5X5SGltb4Jw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'";

    location = / {
        return 302 /dashboard/;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $relayhall_csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # `/about` is the product's documented root information surface. Keep the
    # SPA itself under Vite's `/dashboard/` basename, but make a cold request to
    # the documented route converge on that exact client route instead of
    # falling through to nginx's default 404 page.
    location = /about {
        absolute_redirect off;
        return 302 /dashboard/about;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $relayhall_csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The human administration shell is the other documented root surface a
    # person types from memory, and until now `/settings` and
    # `/settings/access` fell through to nginx's default 404 page while
    # `/dashboard/settings/access` answered 200 (card c57a8fbf, correction
    # report 2daeee9c). Same ergonomic gap, same treatment as `/about` above.
    #
    # TWO locations, not a regex: an exact match for the bare path and a
    # prefix match for the children. `location /settings/` cannot match
    # `/settingsomething`, and neither can reorder how the rest of this
    # server block matches, which a regex location would.
    #
    # The target is `/dashboard$request_uri` rather than a literal path
    # because the settings children carry query strings that mean something —
    # the Access manager's deep link is `?approval=<id>` — and a literal
    # target would drop precisely the thing the deep link exists to carry.
    # `$request_uri` cannot contain CR or LF (nginx rejects such a request
    # line), and the result stays same-origin: it is a path, prefixed with
    # `/dashboard`, returned with `absolute_redirect off`.
    #
    # NOT A ROUTE CENSUS. Card c57a8fbf withdrew the originally suggested
    # gate ("every top-level client route has an nginx fallback"): under a
    # single-basename SPA the correct invariant is that ONE `try_files`
    # fallback covers every client route, which `location /dashboard/` below
    # already does. Enumerating client routes against nginx locations would
    # encode the misdiagnosis the card was re-scoped to remove. This block
    # answers two specific guessable root paths and claims nothing more.
    location = /settings {
        absolute_redirect off;
        return 302 /dashboard$request_uri;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $relayhall_csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /settings/ {
        absolute_redirect off;
        return 302 /dashboard$request_uri;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $relayhall_csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Scoped principal notifications are separate from dashboard broadcasts.
    location = /api/events/ws {
        proxy_pass http://relayhall-backend:3001/events/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $relayhall_forwarded_host;
        proxy_set_header X-Forwarded-Proto $relayhall_forwarded_proto;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        access_log off;
    }

    location = /api/ws {
        proxy_pass http://relayhall-backend:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $relayhall_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $relayhall_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /ws {
        proxy_pass http://relayhall-backend:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $relayhall_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $relayhall_forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://relayhall-backend:3001/;
        proxy_set_header Host $relayhall_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $relayhall_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /dashboard/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;

        # THE DOCUMENT MUST NEVER BE REUSED WITHOUT ASKING. Until this line
        # existed the shell was served with an ETag and no freshness directive
        # at all, so a browser applied HEURISTIC freshness to it and could
        # answer a direct navigation from cache without contacting nginx. The
        # shell names ONE hashed bundle, and the bundles below are `immutable`
        # for a year, so a stale shell does not degrade — it pins the session
        # to a build that no longer exists on the server (owner report: an old
        # `index-DnCFZc_A.js` shell with no identity and a blank map, which one
        # explicit reload cured).
        #
        # `no-cache` rather than the `no-store` used on the redirects in this
        # file, because this response has a body worth keeping: `no-cache`
        # stores it and revalidates before every reuse, so the common answer is
        # a 304 instead of a 3.9 kB re-download, and — unlike `no-store` —
        # it does not disqualify the page from the back/forward cache.
        # `must-revalidate` forbids any proxy serving it stale on our behalf.
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy $relayhall_csp always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            # REPEATED, NOT INHERITED. An `add_header` in a child location
            # DISCARDS every header the parent set — so without these three lines
            # every script, stylesheet and font would ship with no CSP and no
            # nosniff, while the document above looked protected. That is exactly
            # the trap review S-F3 names, and it is invisible unless you fetch an
            # asset and read its headers.
            add_header Cache-Control "public, immutable";
            add_header Content-Security-Policy $relayhall_csp always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    location = /dashboard {
        return 302 /dashboard/;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $relayhall_csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Browsers ask for /favicon.ico on their own; the icon lives in the built
    # assets (/dashboard/favicon.ico). Serve it here instead of a 404 that nginx
    # logs as an error on every first visit.
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /release-manifest.json {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
