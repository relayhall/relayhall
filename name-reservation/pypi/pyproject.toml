[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayhall"
version = "0.0.1"
description = "RelayHall name reservation package. The governed, self-hosted work hub is developed at github.com/relayhall."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.urls]
Homepage = "https://relayhall.com"
Repository = "https://github.com/relayhall/relayhall"

[tool.setuptools.packages.find]
where = ["src"]
